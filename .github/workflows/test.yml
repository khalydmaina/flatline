name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a fresh event and a stale one
        run: |
          printf 'timestamp,action\n%s,buy\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > fresh.csv
          printf 'timestamp,action\n2020-01-01T00:00:00Z,buy\n' > stale.csv
      - name: Fresh data passes
        uses: ./
        with:
          source: fresh.csv
          where: action=buy
      - name: Stale data fails
        id: stale
        continue-on-error: true
        uses: ./
        with:
          source: stale.csv
          window: 7d
      - name: Check the stale run failed
        run: test "${{ steps.stale.outcome }}" = "failure"
